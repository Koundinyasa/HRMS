name: hrms

services:

  # ==========================================
  # HRMS FRONTEND
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    image: ${DOCKERHUB_USERNAME:-teluguvenkata33}/hrms-frontend:latest

    container_name: hrms-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - hrms-network


  # ==========================================
  # HRMS BACKEND
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ${DOCKERHUB_USERNAME:-teluguvenkata33}/hrms-backend:latest

    container_name: hrms-backend

    ports:
      - "3001:3001"

    env_file:
      - path: ./backend/.env
        format: raw
        required: false

    environment:
      NODE_ENV: development
      PORT: 3001
      SWAGGER_ENABLED: "true"
      PYTHON_ATTENDANCE_URL: http://attendance:5000

    depends_on:
      - attendance

    restart: unless-stopped

    networks:
      - hrms-network


  # ==========================================
  # HRMS ATTENDANCE SERVICE
  # ==========================================
  attendance:
    build:
      context: ./attendance-service
      dockerfile: Dockerfile

    image: ${DOCKERHUB_USERNAME:-teluguvenkata33}/hrms-attendance-service:latest

    container_name: hrms-attendance-service

    ports:
      - "5000:5000"

    env_file:
      - path: ./attendance-service/.env
        format: raw
        required: false

    restart: unless-stopped

    networks:
      - hrms-network


# ==========================================
# HRMS DOCKER NETWORK
# ==========================================
networks:
  hrms-network:
    name: hrms-network
    driver: bridge