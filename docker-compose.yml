
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: ssuresh333/kts-people360-frontend:latest
    container_name: people360-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ssuresh333/kts-people360-backend:latest
    container_name: people360-backend
    ports:
      - "3001:3001"
    env_file:
      - path: ./backend/.env
        format: raw
    environment:
      NODE_ENV: production
      SWAGGER_ENABLED: "true"
    restart: unless-stopped

  attendance:
    build:
      context: ./attendance-service
      dockerfile: Dockerfile
    image: ssuresh333/kts-people360-attendance:latest
    container_name: people360-attendance
    ports:
      - "5000:5000"
    env_file:
      - path: ./attendance-service/.env
        format: raw
    restart: unless-stopped
