services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: teluguvenkata33/kts-people360-frontend
    container_name: people360-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - kts-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: teluguvenkata33/kts-people360-backend
    container_name: people360-backend
    ports:
      - "3001:3001"
    env_file:
      - path: ./backend/.env
        format: raw
        required: false
    environment:
      NODE_ENV: development
      PORT: 3001
      SWAGGER_ENABLED: "true"
      PYTHON_ATTENDANCE_URL: http://attendance:5000
    depends_on:
      - attendance
    restart: unless-stopped
    networks:
      - kts-network

  attendance:
    build:
      context: ./attendance-service
      dockerfile: Dockerfile
    image: teluguvenkata33/kts-people360-attendance
    container_name: people360-attendance
    ports:
      - "5000:5000"
    env_file:
      - path: ./attendance-service/.env
        format: raw
        required: false
    restart: unless-stopped
    networks:
      - kts-network

networks:
  kts-network:
    driver: bridge