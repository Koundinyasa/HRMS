name: KTS-People360 and Attendance Service CI/CD

on:
  push:
    branches:
      - Devops_D

  pull_request:
    branches:
      - Devops_D

  workflow_dispatch:

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'

  DOCKER_IMAGE_BACKEND: kts-people360-backend
  DOCKER_IMAGE_FRONTEND: kts-people360-frontend
  DOCKER_IMAGE_ATTENDANCE: attendance-service

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: KTS PEOPLE360 BACKEND TEST
  # ==========================================
  test-backend:
    name: Test KTS Backend
    runs-on: ubuntu-latest
    if: github.ref_name == 'Devops_D' || github.event_name == 'pull_request'

    steps:
      - name: Checkout KTS Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: backend
        run: npm test

  # ==========================================
  # JOB 2: KTS PEOPLE360 FRONTEND BUILD
  # ==========================================
  build-frontend:
    name: Build KTS Frontend
    runs-on: ubuntu-latest
    if: github.ref_name == 'Devops_D' || github.event_name == 'pull_request'

    steps:
      - name: Checkout KTS Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  # ==========================================
  # JOB 3: ATTENDANCE SERVICE TEST
  # ==========================================
  test-attendance:
    name: Test Attendance Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout KTS Repository
        uses: actions/checkout@v4

      # Verify token and repository access
      - name: Verify Attendance Repository Access
        env:
          GH_TOKEN: ${{ secrets.ATTENDANCE_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: Attendance token is missing"
            exit 1
          fi

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/preethamaz/attendaceservice)

          echo "Attendance Repository HTTP Status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Attendance repository access failed"
            exit 1
          fi

          echo "Attendance repository access verified successfully"

      # Checkout Attendance Repository
      - name: Checkout Attendance Repository
        uses: actions/checkout@v4
        with:
         repository: preethamaz/attendaceservice
         token: ${{ secrets.ATTENDANCE_REPO_TOKEN }}
         path: attendance

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: attendance/requirements.txt

      # Install Dependencies
      - name: Install Dependencies
        working-directory: attendance
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Validate Python Syntax
      - name: Validate Python Syntax
        working-directory: attendance
        run: python -m compileall -q .

      # Check Python Version
      - name: Check Python Version
        run: |
          python --version
          echo "Attendance Service validation completed"

  # ==========================================
  # JOB 4: KTS BACKEND SECURITY SCAN
  # ==========================================
  security-scan-backend:
    name: KTS Backend Security Scan
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout KTS Repository
        uses: actions/checkout@v4

      - name: Trivy Backend Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./backend
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Backend Scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend
          path: trivy-backend.sarif
          if-no-files-found: warn

  # ==========================================
  # JOB 5: KTS FRONTEND SECURITY SCAN
  # ==========================================
  security-scan-frontend:
    name: KTS Frontend Security Scan
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Checkout KTS Repository
        uses: actions/checkout@v4

      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./frontend
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Frontend Scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend
          path: trivy-frontend.sarif
          if-no-files-found: warn

  # ==========================================
  # JOB 6: ATTENDANCE SECURITY SCAN
  # ==========================================
  security-scan-attendance:
    name: Attendance Security Scan
    runs-on: ubuntu-latest
    needs: test-attendance

    steps:
      - name: Checkout Attendance Repository
        uses: actions/checkout@v4
        with:
          repository: preethamaz/attendaceservice
          token: ${{ secrets.ATTENDANCE_REPO_TOKEN }}
          path: attendance

      - name: Trivy Attendance Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./attendance
          format: sarif
          output: trivy-attendance.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Attendance Scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-attendance
          path: trivy-attendance.sarif
          if-no-files-found: warn

  # ==========================================
  # JOB 7: BUILD AND PUSH KTS DOCKER IMAGES
  # ==========================================
  build-push-kts:
    name: Build and Push KTS Docker Images
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - build-frontend
      - security-scan-backend
      - security-scan-frontend

    if: github.ref == 'refs/heads/Devops_D' && github.event_name != 'pull_request'

    steps:
      - name: Checkout KTS Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_BACKEND }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 8: BUILD AND PUSH ATTENDANCE IMAGE
  # ==========================================
  build-push-attendance:
    name: Build and Push Attendance Image
    runs-on: ubuntu-latest
    needs:
      - test-attendance
      - security-scan-attendance

    if: github.ref == 'refs/heads/Devops_D' && github.event_name != 'pull_request'

    steps:
      - name: Checkout Attendance Repository
        uses: actions/checkout@v4
        with:
          repository: preethamaz/attendaceservice
          token: ${{ secrets.ATTENDANCE_REPO_TOKEN }}
          path: attendance

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Attendance Image
        uses: docker/build-push-action@v6
        with:
          context: ./attendance
          file: ./attendance/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_ATTENDANCE }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_ATTENDANCE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 9: KTS DOCKER IMAGE SECURITY SCAN
  # ==========================================
  image-security-scan-kts:
    name: KTS Docker Image Security Scan
    runs-on: ubuntu-latest
    needs: build-push-kts

    steps:
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_BACKEND }}:latest
          format: table
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest
          format: table
          severity: CRITICAL,HIGH
        continue-on-error: true

  # ==========================================
  # JOB 10: ATTENDANCE DOCKER IMAGE SCAN
  # ==========================================
  image-security-scan-attendance:
    name: Attendance Docker Image Security Scan
    runs-on: ubuntu-latest
    needs: build-push-attendance

    steps:
      - name: Scan Attendance Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_ATTENDANCE }}:latest
          format: table
          severity: CRITICAL,HIGH
        continue-on-error: true

  # ==========================================
  # JOB 11: KTS DEPLOYMENT INFORMATION
  # ==========================================
  deploy-kts:
    name: KTS Deployment Information
    runs-on: ubuntu-latest
    needs: image-security-scan-kts

    if: github.ref == 'refs/heads/Devops_D' && github.event_name != 'pull_request'

    steps:
      - name: Deployment Information
        run: |
          echo "KTS-People360 CI/CD pipeline completed"
          echo "Branch: Devops_D"
          echo "Target: AWS EKS"
          echo "Actual AWS deployment is not configured."

  # ==========================================
  # JOB 12: ATTENDANCE DEPLOYMENT INFORMATION
  # ==========================================
  deploy-attendance:
    name: Attendance Deployment Information
    runs-on: ubuntu-latest
    needs: image-security-scan-attendance

    if: github.ref == 'refs/heads/Devops_D' && github.event_name != 'pull_request'

    steps:
      - name: Deployment Information
        run: |
          echo "Attendance Service CI/CD completed"
          echo "Pipeline trigger branch: Devops_D (KTS repository)"
          echo "Python Version: ${{ env.PYTHON_VERSION }}"
          echo "Docker Image: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_ATTENDANCE }}:latest"
          echo "Target: AWS"
          echo "Actual AWS deployment is not configured."