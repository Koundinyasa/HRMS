# =====================================================
# KTS-PEOPLE360 - COMPLETE CI/CD PIPELINE
# =====================================================
# Stage 1: SonarCloud Quality Analysis
#
# Stage 2: Application Build and Validation
#   1. Frontend Build
#   2. Backend Build
#   3. Attendance Build
#
# Stage 3: Application Security Scans
#   1. Frontend Security
#   2. Backend Security
#   3. Attendance Security
#
# Stage 4: Build People360 Docker Images
# Stage 5: Docker Image Security Scan
# Stage 6: Push Images to Docker Hub
# =====================================================

name: KTS-People360 CI/CD

on:
  push:
    branches:
      - Devops

  pull_request:
    branches:
      - Devops

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: people360-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PYTHON_VERSION: "3.11"

jobs:

  # =====================================================
  # STAGE 1 - SONARCLOUD QUALITY ANALYSIS
  # =====================================================

  sonarcloud:
    name: "Stage 1 - SonarCloud Quality Analysis"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Tests with Coverage
        working-directory: backend
        run: npm test -- --coverage --coverageReporters=lcov
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: fooddelivery
          NODE_ENV: test

      - name: Display Coverage Report
        run: |
          echo "=== Checking coverage files ==="
          ls -la backend/coverage/ || echo "No coverage directory!"

          echo "=== Looking for lcov.info ==="
          find backend -name "lcov.info" || echo "lcov.info not found!"

      - name: Check SonarCloud Authentication
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_HRMS }}
        run: |
          echo "Checking SonarCloud authentication..."

          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONARQUBE_HRMS secret is missing or empty."
            exit 1
          fi

          response=$(curl -sS \
            --user "${SONAR_TOKEN}:" \
            https://sonarcloud.io/api/authentication/validate)

          echo "Authentication response: $response"

          if ! echo "$response" | grep -q '"valid":true'; then
            echo "ERROR: SonarCloud token is invalid."
            exit 1
          fi

          echo "SUCCESS: SonarCloud token is valid."

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.HRMS_GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_HRMS }}
        with:
          args: >
            -Dsonar.organization=koundinyasa
            -Dsonar.projectKey=Koundinyasa_HRMS
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.tests=backend/src,frontend/src
            -Dsonar.test.inclusions=**/*.test.js
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/*.test.js


  # =====================================================
  # STAGE 2 - APPLICATION BUILD AND VALIDATION
  # THREE INDEPENDENT JOBS / THREE SEPARATE BOXES
  # =====================================================

  # -------------------------
  # BOX 1 - FRONTEND BUILD
  # -------------------------

  frontend-build:
    name: "Stage 2 - Frontend Build"
    runs-on: ubuntu-latest
    needs: sonarcloud

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build


  # -------------------------
  # BOX 2 - BACKEND BUILD
  # -------------------------

  backend-build:
    name: "Stage 2 - Backend Build"
    runs-on: ubuntu-latest
    needs: sonarcloud

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Run Backend Tests
        working-directory: backend
        run: npm test -- --runInBand


  # -------------------------
  # BOX 3 - ATTENDANCE BUILD
  # -------------------------

  attendance-build:
    name: "Stage 2 - Attendance Build"
    runs-on: ubuntu-latest
    needs: sonarcloud

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: attendance-service/requirements.txt

      - name: Install Attendance Dependencies
        working-directory: attendance-service
        run: |
          python -m pip install --upgrade pip

          grep -vi '^msvc-runtime==' requirements.txt > requirements-linux.txt

          pip install -r requirements-linux.txt

          pip install face-recognition==1.3.0

      - name: Validate Attendance Python Files
        run: python -m compileall -q attendance-service


  # =====================================================
  # STAGE 3 - APPLICATION SECURITY SCANS
  # THREE INDEPENDENT JOBS / THREE SEPARATE BOXES
  #
  # Each security job waits for ALL THREE Stage 2 jobs.
  # =====================================================

  # -------------------------
  # BOX 1 - FRONTEND SECURITY
  # -------------------------

  frontend-security:
    name: "Stage 3 - Frontend Security"
    runs-on: ubuntu-latest

    needs:
      - frontend-build
      - backend-build
      - attendance-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend NPM Security Audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table


  # -------------------------
  # BOX 2 - BACKEND SECURITY
  # -------------------------

  backend-security:
    name: "Stage 3 - Backend Security"
    runs-on: ubuntu-latest

    needs:
      - frontend-build
      - backend-build
      - attendance-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Backend NPM Security Audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Backend Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          vuln-type: os,library
          exit-code: "1"
          format: table


  # -------------------------
  # BOX 3 - ATTENDANCE SECURITY
  # -------------------------

  attendance-security:
    name: "Stage 3 - Attendance Security"
    runs-on: ubuntu-latest

    needs:
      - frontend-build
      - backend-build
      - attendance-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Attendance Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: attendance-service
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table


  # =====================================================
  # STAGE 4 - BUILD PEOPLE360 DOCKER IMAGES
  # =====================================================

  docker-build:
    name: "Stage 4 - Build People360 Docker Images"
    runs-on: ubuntu-latest

    needs:
      - frontend-security
      - backend-security
      - attendance-security

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build Frontend Docker Image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -f frontend/Dockerfile \
            -t people360-frontend:${{ github.sha }} \
            frontend

      - name: Build Backend Docker Image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t people360-backend:${{ github.sha }} \
            backend

      - name: Build Attendance Docker Image
        run: |
          docker build \
            -f attendance-service/Dockerfile \
            -t people360-attendance:${{ github.sha }} \
            -t people360-attendance:latest \
            attendance-service

      - name: Verify Docker Images
        run: docker images

      - name: Save Docker Images
        run: |
          docker save \
            people360-frontend:${{ github.sha }} \
            people360-backend:${{ github.sha }} \
            people360-attendance:${{ github.sha }} \
            -o people360-images.tar

      - name: Upload Docker Images Artifact
        uses: actions/upload-artifact@v6
        with:
          name: people360-docker-images
          path: people360-images.tar
          retention-days: 1


  # =====================================================
  # STAGE 5 - DOCKER IMAGE SECURITY SCAN
  # =====================================================

  docker-image-scan:
    name: "Stage 5 - Docker Image Security Scan"
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Download Docker Images Artifact
        uses: actions/download-artifact@v6
        with:
          name: people360-docker-images

      - name: Load Docker Images
        run: |
          docker load -i people360-images.tar
          docker images

      - name: Frontend Docker Image Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: people360-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Backend Docker Image Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: people360-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Attendance Docker Image Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: people360-attendance:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table


  # =====================================================
  # STAGE 6 - PUSH IMAGES TO DOCKER HUB
  # =====================================================

  docker-push:
    name: "Stage 6 - Push Images to Docker Hub"
    runs-on: ubuntu-latest

    needs: docker-image-scan

    if: github.event_name != 'pull_request'

    steps:
      - name: Download Docker Images Artifact
        uses: actions/download-artifact@v6
        with:
          name: people360-docker-images

      - name: Load Docker Images
        run: docker load -i people360-images.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push Frontend Image
        run: |
          docker tag \
            people360-frontend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-frontend:${{ github.sha }}

          docker tag \
            people360-frontend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-frontend:latest

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-frontend:latest

      - name: Tag and Push Backend Image
        run: |
          docker tag \
            people360-backend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-backend:${{ github.sha }}

          docker tag \
            people360-backend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-backend:latest

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-backend:latest

      - name: Tag and Push Attendance Image
        run: |
          docker tag \
            people360-attendance:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-attendance:${{ github.sha }}

          docker tag \
            people360-attendance:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-attendance:latest

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-attendance:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/kts-people360-attendance:latest
