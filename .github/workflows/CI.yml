# =====================================================
# HRMS - COMPLETE CI/CD PIPELINE
# =====================================================
# Services:
#   1. Backend
#   2. Frontend
#   3. Attendance-Service
#
# Jobs:
#   1. SonarCloud Quality Analysis
#   2. Backend Testing
#   3. Backend Security Scan
#   4. Frontend Security Scan
#   5. Attendance Security Scan
#   6. Build & Push Docker Images
#   7. Docker Image Security Scans
#   8. AWS Deployment
#   9. Pipeline Notification
# =====================================================

name: HRMS CI/CD Pipeline

on:
  push:
    branches: [Devops_Testing]
  pull_request:
    branches: [Devops_Testing]

env:
  NODE_VERSION: '18'

  DOCKER_IMAGE_BACKEND: hrms-backend
  DOCKER_IMAGE_FRONTEND: hrms-frontend
  DOCKER_IMAGE_ATTENDANCE: hrms-attendance-service

jobs:

  
  # =====================================================
  # JOB 0: SONARCLOUD QUALITY ANALYSIS
  # =====================================================
  sonarcloud:
    name: SonarCloud Quality Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Tests with Coverage
        run: |
          cd backend
          npm test -- --coverage --coverageReporters=lcov
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: fooddelivery
          NODE_ENV: test

      - name: Display Coverage Report
        run: |
          echo "=== Checking coverage files ==="
          ls -la backend/coverage/ || echo "No coverage directory!"
          echo "=== Looking for lcov.info ==="
          find backend -name "lcov.info" || echo "lcov.info not found!"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.HRMS_GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=YOUR_ACTUAL_ORGANIZATION_KEY
            -Dsonar.projectKey=YOUR_ACTUAL_PROJECT_KEY
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.tests=backend/src,frontend/src
            -Dsonar.test.inclusions=**/*.test.js
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/*.test.js


  # =====================================================
  # JOB 1: BACKEND TESTING
  # =====================================================
  test-backend:
    name: Test HRMS Backend API
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: always()

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fooddelivery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Unit Tests
        run: |
          cd backend
          npm test
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: fooddelivery
          NODE_ENV: test

      - name: Upload Backend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrms-backend-test-results
          path: backend/coverage/
          retention-days: 7

  # =====================================================
  # JOB 2: BACKEND SECURITY SCAN
  # =====================================================
  security-scan-backend:
    name: Security Scan - HRMS Backend
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Backend Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./backend
          format: sarif
          output: trivy-backend-code.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Backend Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrms-trivy-backend-code
          path: trivy-backend-code.sarif
          retention-days: 7

  # =====================================================
  # JOB 3: FRONTEND SECURITY SCAN
  # =====================================================
  security-scan-frontend:
    name: Security Scan - HRMS Frontend
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Frontend Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./frontend
          format: sarif
          output: trivy-frontend-code.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Frontend Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrms-trivy-frontend-code
          path: trivy-frontend-code.sarif
          retention-days: 7

  # =====================================================
  # JOB 4: ATTENDANCE SERVICE SECURITY SCAN
  # =====================================================
  security-scan-attendance:
    name: Security Scan - HRMS Attendance Service
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Attendance Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./attendance-service
          format: sarif
          output: trivy-attendance-code.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Attendance Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrms-trivy-attendance-code
          path: trivy-attendance-code.sarif
          retention-days: 7

  # =====================================================
  # JOB 5: BUILD & PUSH ALL THREE DOCKER IMAGES
  # =====================================================
  build-and-push:
    name: Build & Push HRMS Docker Images
    runs-on: ubuntu-latest

    needs:
      - test-backend
      - security-scan-backend
      - security-scan-frontend
      - security-scan-attendance

    if: github.event_name == 'push' && github.ref == 'refs/heads/Devops_Testing'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------------
      # BUILD & PUSH BACKEND
      # -----------------------------------------------
      - name: Build and Push HRMS Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_BACKEND }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------
      # BUILD & PUSH FRONTEND
      # -----------------------------------------------
      - name: Build and Push HRMS Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------
      # BUILD & PUSH ATTENDANCE SERVICE
      # -----------------------------------------------
      - name: Build and Push HRMS Attendance Service
        uses: docker/build-push-action@v5
        with:
          context: ./attendance-service
          file: ./attendance-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_ATTENDANCE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_ATTENDANCE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =================================================
      # JOB 6: DOCKER IMAGE SECURITY SCANS
      # =================================================

      - name: Scan HRMS Backend Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_BACKEND }}:latest
          format: sarif
          output: trivy-backend-image.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Scan HRMS Frontend Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest
          format: sarif
          output: trivy-frontend-image.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Scan HRMS Attendance Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_ATTENDANCE }}:latest
          format: sarif
          output: trivy-attendance-image.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload All Docker Image Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrms-trivy-image-scans
          path: |
            trivy-backend-image.sarif
            trivy-frontend-image.sarif
            trivy-attendance-image.sarif
          retention-days: 7

  
  # =====================================================
  # JOB 7: AWS DEPLOYMENT (PLACEHOLDER)
  # =====================================================
  deploy:
    name: HRMS Deployment Preparation
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/Devops_Testing'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: HRMS Deployment Information
        run: |
          echo "=========================================="
          echo "HRMS DEPLOYMENT INFORMATION"
          echo "=========================================="

          echo "Backend Image: ${{ env.DOCKER_IMAGE_BACKEND }}"
          echo "Frontend Image: ${{ env.DOCKER_IMAGE_FRONTEND }}"
          echo "Attendance Image: ${{ env.DOCKER_IMAGE_ATTENDANCE }}"

          echo "Target: AWS EKS Cluster"
          echo "Strategy: Blue-Green Deployment"
          echo "=========================================="

          echo "AWS credentials are not configured."
          echo "Actual AWS deployment is pending."


  
  # =====================================================
  # JOB 8: PIPELINE NOTIFICATION
  # =====================================================
  notify:
    name: HRMS Pipeline Notification
    runs-on: ubuntu-latest

    needs:
      - sonarcloud
      - test-backend
      - security-scan-backend
      - security-scan-frontend
      - security-scan-attendance

    if: always()

    steps:
      - name: Check Pipeline Status
        run: |
          echo "=========================================="
          echo "HRMS CI/CD PIPELINE STATUS"
          echo "=========================================="

          echo "SonarCloud: ${{ needs.sonarcloud.result }}"
          echo "Backend Tests: ${{ needs.test-backend.result }}"
          echo "Backend Security: ${{ needs.security-scan-backend.result }}"
          echo "Frontend Security: ${{ needs.security-scan-frontend.result }}"
          echo "Attendance Security: ${{ needs.security-scan-attendance.result }}"

          echo "=========================================="
          echo "HRMS PIPELINE COMPLETED"
          echo "=========================================="