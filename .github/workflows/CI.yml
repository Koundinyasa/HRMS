
name: KTS-People360 CI/CD

on:
  push:
    branches:
      - Devops_D
  pull_request:
    branches:
      - Devops_D
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: people360-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PYTHON_VERSION: "3.11"

jobs:

  # ==========================================
  # JOB 1: FRONTEND BUILD
  # ==========================================

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # ==========================================
  # JOB 2: FRONTEND SECURITY SCAN
  # ==========================================

  frontend-security:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    needs: frontend-build

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: NPM Audit
        run: npm audit --audit-level=high

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table


  # ==========================================
  # JOB 3: BACKEND BUILD AND TEST
  # ==========================================

  backend-build:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test -- --runInBand


  # ==========================================
  # JOB 4: BACKEND SECURITY SCAN
  # ==========================================

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    needs: backend-build

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: NPM Audit
        run: npm audit --audit-level=high

      - name: Backend Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          vuln-type: os,library
          exit-code: '1'
          format: table


  # ==========================================
  # JOB 5: ATTENDANCE SERVICE BUILD
  # ==========================================

  attendance-build:
    name: Attendance Service Build and Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: attendance-service/requirements.txt

      - name: Install Attendance Dependencies
        working-directory: attendance-service
        run: |
          python -m pip install --upgrade pip
          grep -vi '^msvc-runtime==' requirements.txt > requirements-linux.txt
          pip install -r requirements-linux.txt
          pip install face-recognition==1.3.0

      - name: Validate Python syntax
        run: |
          python -m compileall -q attendance-service


  # ==========================================
  # JOB 6: ATTENDANCE SERVICE SECURITY SCAN
  # ==========================================

  attendance-security:
    name: Attendance Service Security Scan
    runs-on: ubuntu-latest
    needs: attendance-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Attendance Docker Image
        run: |
          docker build \
            -t people360-attendance:${{ github.sha }} \
            ./attendance-service

      - name: Verify Attendance Docker Image
        run: |
          docker images people360-attendance

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: people360-attendance:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'
