# ==========================================================
# HRMS PORTAL - CI/CD PIPELINE
# ==========================================================
# Project: Koundinyasa HRMS
# Repository: Koundinyasa/HRMS
#
# Services:
#   1. Frontend
#   2. Backend
#   3. Attendance Service
#
# Pipeline:
#   Build -> Test -> Security Scan
#   -> Docker Build -> Image Scan
#   -> Docker Hub Push -> Notification
#
# Triggers: Push to main/Devops_Testing, PR to Devops_Testing 
#==========================================================

name: Koundinyasa HRMS CI/CD

on:
  push:
    branches:
      - Devops_Testing

  pull_request:
    branches:
      - Devops_Testing

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: hrms-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"

jobs:

  # ==========================================================
  # JOB 1: FRONTEND BUILD
  # ==========================================================

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout HRMS Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build


  # ==========================================================
  # JOB 2: FRONTEND SECURITY SCAN
  # ==========================================================

  frontend-security:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - name: Checkout HRMS Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: NPM Audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend Trivy Security Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ./frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table


  # ==========================================================
  # JOB 3: BACKEND BUILD AND TEST
  # ==========================================================

  backend-build:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout HRMS Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Build Backend
        run: npm run build

      - name: Run Backend Tests
        run: npm test -- --runInBand


  # ==========================================================
  # JOB 4: BACKEND SECURITY SCAN
  # ==========================================================

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - name: Checkout HRMS Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: NPM Audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Backend Trivy Security Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ./backend
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          vuln-type: os,library
          exit-code: "1"
          format: table


  # ==========================================================
  # JOB 5: ATTENDANCE SERVICE BUILD
  # ==========================================================

  attendance-build:
    name: Attendance Service Build and Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout HRMS Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: attendance-service/requirements.txt

      - name: Install Attendance Dependencies
        working-directory: attendance-service
        run: |
          python -m pip install --upgrade pip

          grep -vi '^msvc-runtime==' requirements.txt > requirements-linux.txt

          pip install -r requirements-linux.txt

          pip install face-recognition==1.3.0

      - name: Validate Python Syntax
        run: |
          python -m compileall -q attendance-service


  # ==========================================================
  # JOB 6: ATTENDANCE SERVICE SECURITY SCAN
  # ==========================================================

  attendance-security:
    name: Attendance Service Security Scan
    runs-on: ubuntu-latest
    needs: attendance-build

    steps:
      - name: Checkout HRMS Repository
        uses: actions/checkout@v4

      - name: Attendance Trivy Security Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ./attendance-service
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table
        continue-on-error: true


  # ==========================================================
  # JOB 7: BUILD ALL HRMS DOCKER IMAGES
  # ==========================================================

  docker-build:
    name: Build HRMS Docker Images
    runs-on: ubuntu-latest

    needs:
      - frontend-security
      - backend-security
      - attendance-security

    steps:
      - name: Checkout HRMS Repository
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -f frontend/Dockerfile \
            -t hrms-frontend:${{ github.sha }} \
            frontend

      - name: Build Backend Docker Image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t hrms-backend:${{ github.sha }} \
            backend

      - name: Build Attendance Docker Image
        run: |
          docker build \
            -f attendance-service/Dockerfile \
            -t hrms-attendance:${{ github.sha }} \
            -t hrms-attendance:latest \
            attendance-service

      - name: Save Docker Images
        run: |
          docker save \
            hrms-frontend:${{ github.sha }} \
            hrms-backend:${{ github.sha }} \
            hrms-attendance:${{ github.sha }} \
            -o hrms-docker-images.tar

      - name: Upload Docker Images
        uses: actions/upload-artifact@v4
        with:
          name: hrms-docker-images
          path: hrms-docker-images.tar
          retention-days: 1


  # ==========================================================
  # JOB 8: DOCKER IMAGE SECURITY SCAN
  # ==========================================================

  docker-image-scan:
    name: HRMS Docker Image Security Scan
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: hrms-docker-images

      - name: Load Docker Images
        run: docker load -i hrms-docker-images.tar

      - name: Scan Frontend Docker Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hrms-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan Backend Docker Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hrms-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan Attendance Docker Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hrms-attendance:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table


  # ==========================================================
  # JOB 9: PUSH ALL IMAGES TO DOCKER HUB
  # ==========================================================

  docker-push:
    name: Push HRMS Images to Docker Hub
    runs-on: ubuntu-latest

    needs: docker-image-scan

    if: github.event_name != 'pull_request'

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: hrms-docker-images

      - name: Load Docker Images
        run: docker load -i hrms-docker-images.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------
      # FRONTEND IMAGE TAGGING
      # ------------------------------------------

      - name: Tag Frontend Image
        run: |
          docker tag hrms-frontend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/hrms-frontend:${{ github.sha }}

          docker tag hrms-frontend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/hrms-frontend:latest

      # ------------------------------------------
      # BACKEND IMAGE TAGGING
      # ------------------------------------------

      - name: Tag Backend Image
        run: |
          docker tag hrms-backend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/hrms-backend:${{ github.sha }}

          docker tag hrms-backend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/hrms-backend:latest

      # ------------------------------------------
      # ATTENDANCE IMAGE TAGGING
      # ------------------------------------------

      - name: Tag Attendance Image
        run: |
          docker tag hrms-attendance:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/hrms-attendance:${{ github.sha }}

          docker tag hrms-attendance:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/hrms-attendance:latest

      # ------------------------------------------
      # PUSH FRONTEND IMAGE
      # ------------------------------------------

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hrms-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hrms-frontend:latest

      # ------------------------------------------
      # PUSH BACKEND IMAGE
      # ------------------------------------------

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hrms-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hrms-backend:latest

      # ------------------------------------------
      # PUSH ATTENDANCE IMAGE
      # ------------------------------------------

      - name: Push Attendance Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hrms-attendance:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hrms-attendance:latest


  # ==========================================================
  # JOB 10: PIPELINE NOTIFICATION
  # ==========================================================

  notify:
    name: HRMS Pipeline Notification
    runs-on: ubuntu-latest

    needs:
      - frontend-build
      - frontend-security
      - backend-build
      - backend-security
      - attendance-build
      - attendance-security
      - docker-build
      - docker-image-scan
      - docker-push

    if: always()

    steps:
      - name: Check Pipeline Status
        env:
          FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          FRONTEND_SECURITY: ${{ needs.frontend-security.result }}
          BACKEND_BUILD: ${{ needs.backend-build.result }}
          BACKEND_SECURITY: ${{ needs.backend-security.result }}
          ATTENDANCE_BUILD: ${{ needs.attendance-build.result }}
          ATTENDANCE_SECURITY: ${{ needs.attendance-security.result }}
          DOCKER_BUILD: ${{ needs.docker-build.result }}
          DOCKER_SCAN: ${{ needs.docker-image-scan.result }}
          DOCKER_PUSH: ${{ needs.docker-push.result }}

        run: |
          echo "================================================"
          echo "       KOUNDINYASA HRMS CI/CD STATUS"
          echo "================================================"

          echo "Frontend Build:       $FRONTEND_BUILD"
          echo "Frontend Security:    $FRONTEND_SECURITY"

          echo "Backend Build:        $BACKEND_BUILD"
          echo "Backend Security:     $BACKEND_SECURITY"

          echo "Attendance Build:     $ATTENDANCE_BUILD"
          echo "Attendance Security:  $ATTENDANCE_SECURITY"

          echo "Docker Build:         $DOCKER_BUILD"
          echo "Docker Image Scan:    $DOCKER_SCAN"
          echo "Docker Hub Push:      $DOCKER_PUSH"

          echo "================================================"

          if [[ "$FRONTEND_BUILD" == "success" &&
                "$FRONTEND_SECURITY" == "success" &&
                "$BACKEND_BUILD" == "success" &&
                "$BACKEND_SECURITY" == "success" &&
                "$ATTENDANCE_BUILD" == "success" &&
                "$ATTENDANCE_SECURITY" == "success" &&
                "$DOCKER_BUILD" == "success" &&
                "$DOCKER_SCAN" == "success" ]]; then

            echo "HRMS CI/CD validation completed successfully."

          else

            echo "HRMS CI/CD pipeline completed with failures or skipped jobs."

          fi

          echo "================================================"