
name: KTS-People360 CI/CD 

on:
  push:
    branches:
      - gayathri_devops

  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"

  DOCKER_IMAGE_BACKEND: bgayathridev/kts-people360-backend
  DOCKER_IMAGE_FRONTEND: bgayathridev/kts-people360-frontend
  DOCKER_IMAGE_ATTENDANCE: bgayathridev/attendance-service

jobs:

  # ==========================================
  # JOB 1: KTS BACKEND TEST AND BUILD
  # ==========================================
  test-backend:
    name: Test KTS Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout KTS Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Run Backend Tests
        working-directory: backend
        run: npm test -- --passWithNoTests --runInBand

  # ==========================================
  # JOB 2: KTS FRONTEND BUILD
  # ==========================================
  build-frontend:
    name: Build KTS Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout KTS Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  # ==========================================
  # JOB 3: ATTENDANCE SERVICE TEST
  # ==========================================
  test-attendance:
    name: Test Attendance Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout KTS Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: attendance-service/requirements.txt

      - name: Install Attendance Dependencies
        working-directory: attendance-service
        run: |
          python -m pip install --upgrade pip
          grep -vi '^msvc-runtime==' requirements.txt > requirements-linux.txt
          pip install -r requirements-linux.txt
          pip install face-recognition==1.3.0

      - name: Validate Python Syntax
        working-directory: attendance-service
        run: python -m compileall -q .

      - name: Check Python Version
        run: |
          python --version
          echo "Attendance Service validation completed"

  # ==========================================
  # JOB 4: KTS BACKEND SECURITY SCAN
  # ==========================================
  security-scan-backend:
    name: KTS Backend Security Scan
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout KTS Repository
        uses: actions/checkout@v4

      - name: Trivy Backend Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: ./backend
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Backend Scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend
          path: trivy-backend.sarif
          if-no-files-found: warn

  # ==========================================
  # JOB 5: KTS FRONTEND SECURITY SCAN
  # ==========================================
  security-scan-frontend:
    name: KTS Frontend Security Scan
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Checkout KTS Repository
        uses: actions/checkout@v4

      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: ./frontend
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Frontend Scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend
          path: trivy-frontend.sarif
          if-no-files-found: warn

  # ==========================================
  # JOB 6: ATTENDANCE SECURITY SCAN
  # ==========================================
  security-scan-attendance:
    name: Attendance Security Scan
    runs-on: ubuntu-latest
    needs: test-attendance

    steps:
      - name: Checkout KTS Repository
        uses: actions/checkout@v4

      - name: Trivy Attendance Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: ./attendance-service
          format: sarif
          output: trivy-attendance.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Attendance Scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-attendance
          path: trivy-attendance.sarif
          if-no-files-found: warn

  # ==========================================
  # JOB 7: BUILD AND PUSH KTS DOCKER IMAGES
  # ==========================================
  build-push-kts:
    name: Build and Push KTS Docker Images
    runs-on: ubuntu-latest

    needs:
      - test-backend
      - build-frontend
      - security-scan-backend
      - security-scan-frontend

    steps:
      - name: Checkout KTS Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_BACKEND }}:latest
            ${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=http://localhost:3001/api
          tags: |
            ${{ env.DOCKER_IMAGE_FRONTEND }}:latest
            ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 8: BUILD AND PUSH ATTENDANCE IMAGE
  # ==========================================
  build-push-attendance:
    name: Build and Push Attendance Image
    runs-on: ubuntu-latest

    needs:
      - test-attendance
      - security-scan-attendance

    steps:
      - name: Checkout KTS Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Attendance Image
        uses: docker/build-push-action@v6
        with:
          context: ./attendance-service
          file: ./attendance-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_ATTENDANCE }}:latest
            ${{ env.DOCKER_IMAGE_ATTENDANCE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 9: KTS DOCKER IMAGE SECURITY SCAN
  # ==========================================
  image-security-scan-kts:
    name: KTS Docker Image Security Scan
    runs-on: ubuntu-latest
    needs: build-push-kts

    steps:
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

  # ==========================================
  # JOB 10: ATTENDANCE DOCKER IMAGE SECURITY SCAN
  # ==========================================
  image-security-scan-attendance:
    name: Attendance Docker Image Security Scan
    runs-on: ubuntu-latest
    needs: build-push-attendance

    steps:
      - name: Scan Attendance Image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.DOCKER_IMAGE_ATTENDANCE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

  # ==========================================
  # JOB 11: KTS DEPLOYMENT INFORMATION
  # ==========================================
  deploy-kts:
    name: KTS Deployment Information
    runs-on: ubuntu-latest
    needs: image-security-scan-kts

    steps:
      - name: Deployment Information
        run: |
          echo "KTS-People360 CI/CD pipeline completed"
          echo "Branch: gayathri_devops"
          echo "Backend Image: ${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}"
          echo "Frontend Image: ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}"
          echo "Target: AWS EKS"
          echo "Actual AWS deployment is not configured."

  # ==========================================
  # JOB 12: ATTENDANCE DEPLOYMENT INFORMATION
  # ==========================================
  deploy-attendance:
    name: Attendance Deployment Information
    runs-on: ubuntu-latest
    needs: image-security-scan-attendance

    steps:
      - name: Deployment Information
        run: |
          echo "Attendance Service CI/CD completed"
          echo "Branch: gayathri_devops"
          echo "Python Version: ${{ env.PYTHON_VERSION }}"
          echo "Docker Image: ${{ env.DOCKER_IMAGE_ATTENDANCE }}:${{ github.sha }}"
          echo "Target: AWS"
          echo "Actual AWS deployment is not configured."
