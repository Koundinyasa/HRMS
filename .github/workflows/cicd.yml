name: KTS-People360 Combined CI/CD pipeline

on:
  push:
    branches:
      - gayathri_devops
  workflow_dispatch:

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"

  DOCKER_IMAGE_BACKEND: bgayathridev/kts-people360-backend
  DOCKER_IMAGE_FRONTEND: bgayathridev/kts-people360-frontend
  DOCKER_IMAGE_ATTENDANCE: bgayathridev/attendance-service

jobs:

  # ==========================================
  # JOB 1: BACKEND BUILD AND TEST
  # ==========================================

  test-backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Run Backend Tests
        working-directory: backend
        run: npm test -- --passWithNoTests --runInBand


  # ==========================================
  # JOB 2: FRONTEND BUILD
  # ==========================================

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build


  # ==========================================
  # JOB 3: ATTENDANCE SERVICE BUILD AND TEST
  # ==========================================

  test-attendance:
    name: Attendance Service Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Attendance Dependencies
        working-directory: attendance-service
        run: |
          python -m pip install --upgrade pip
          grep -vi '^msvc-runtime==' requirements.txt > requirements-linux.txt
          pip install -r requirements-linux.txt
          pip install face-recognition==1.3.0

      - name: Check Python Files
        working-directory: attendance-service
        run: python -m compileall .

      - name: Verify Face Recognition
        working-directory: attendance-service
        run: python -c "import face_recognition; print('Face recognition installed successfully')"


  # ==========================================
  # JOB 4: BACKEND FILESYSTEM SECURITY SCAN
  # ==========================================

  security-scan-backend:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Check Trivy Download Connectivity
        run: |
          echo "Checking Trivy download server"
          curl -IL --retry 3 https://get.trivy.dev/trivy

          echo "Checking GitHub release"
          curl -IL --retry 3 https://github.com/aquasecurity/trivy/releases/tag/v0.70.0

      - name: Run Trivy Backend Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table


  # ==========================================
  # JOB 5: FRONTEND FILESYSTEM SECURITY SCAN
  # ==========================================

  security-scan-frontend:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: NPM Audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run Trivy Frontend Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table


  # ==========================================
  # JOB 6: ATTENDANCE FILESYSTEM SECURITY SCAN
  # ==========================================

  security-scan-attendance:
    name: Attendance Service Security Scan
    runs-on: ubuntu-latest
    needs: test-attendance

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Attendance Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: attendance-service
          scanners: vuln,secret
          format: sarif
          output: trivy-attendance-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Attendance Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-attendance-results
          path: trivy-attendance-results.sarif
          if-no-files-found: ignore


  # ==========================================
  # JOB 8: BUILD PEOPLE360 DOCKER IMAGES
  # ==========================================

  docker-build:
    name: Build People360 Docker Images
    runs-on: ubuntu-latest

    needs:
      - security-scan-frontend
      - security-scan-backend
      - security-scan-attendance

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Frontend Image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -f frontend/Dockerfile \
            -t people360-frontend:${{ github.sha }} \
            frontend

      - name: Build Backend Image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t people360-backend:${{ github.sha }} \
            backend

      - name: Build Attendance Image
        run: |
          docker build \
            -f attendance-service/Dockerfile \
            -t people360-attendance:${{ github.sha }} \
            attendance-service

      - name: Save Docker Images
        run: |
          docker save \
            people360-frontend:${{ github.sha }} \
            people360-backend:${{ github.sha }} \
            people360-attendance:${{ github.sha }} \
            -o people360-images.tar

      - name: Upload Docker Images
        uses: actions/upload-artifact@v4
        with:
          name: people360-docker-images
          path: people360-images.tar
          retention-days: 1


  # ==========================================
  # JOB 9: DOCKER IMAGE SECURITY SCAN
  # ==========================================

  docker-image-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: people360-docker-images

      - name: Load Docker Images
        run: docker load -i people360-images.tar

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: people360-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: people360-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan Attendance Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: people360-attendance:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table


  # ==========================================
  # JOB 10: PUSH IMAGES TO DOCKER HUB
  # ==========================================

  docker-push:
    name: Push Images to Docker Hub
    runs-on: ubuntu-latest

    needs: docker-image-scan

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: people360-docker-images

      - name: Load Docker Images
        run: docker load -i people360-images.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag Backend Image
        run: |
          docker tag people360-backend:${{ github.sha }} \
            ${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          docker tag people360-backend:${{ github.sha }} \
            ${{ env.DOCKER_IMAGE_BACKEND }}:latest

      - name: Tag Frontend Image
        run: |
          docker tag people360-frontend:${{ github.sha }} \
            ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          docker tag people360-frontend:${{ github.sha }} \
            ${{ env.DOCKER_IMAGE_FRONTEND }}:latest

      - name: Tag Attendance Image
        run: |
          docker tag people360-attendance:${{ github.sha }} \
            ${{ env.DOCKER_IMAGE_ATTENDANCE }}:${{ github.sha }}
          docker tag people360-attendance:${{ github.sha }} \
            ${{ env.DOCKER_IMAGE_ATTENDANCE }}:latest

      - name: Push Backend Image
        run: |
          docker push ${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE_BACKEND }}:latest

      - name: Push Frontend Image
        run: |
          docker push ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE_FRONTEND }}:latest

      - name: Push Attendance Image
        run: |
          docker push ${{ env.DOCKER_IMAGE_ATTENDANCE }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE_ATTENDANCE }}:latest
