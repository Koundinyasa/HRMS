name: KTS-People360 Combined CI/CD Pipeline

on:
  push:
    branches:
      - gayathri_devops
  workflow_dispatch:

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"

  DOCKER_IMAGE_BACKEND: bgayathridev/kts-people360-backend
  DOCKER_IMAGE_FRONTEND: bgayathridev/kts-people360-frontend
  DOCKER_IMAGE_ATTENDANCE: bgayathridev/attendance-service

jobs:

  # --------------------------------------------------
  # 1. Backend Build and Test
  # --------------------------------------------------
  test-backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Run Backend Tests
        working-directory: backend
        run: npm test -- --passWithNoTests --runInBand


  # --------------------------------------------------
  # 2. Frontend Build
  # --------------------------------------------------
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build


  # --------------------------------------------------
  # 3. Attendance Service Build and Test
  # --------------------------------------------------
  test-attendance:
    name: Attendance Service Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Attendance Dependencies
        working-directory: attendance-service
        run: |
          python -m pip install --upgrade pip
          grep -vi '^msvc-runtime==' requirements.txt > requirements-linux.txt
          pip install -r requirements-linux.txt
          pip install face-recognition==1.3.0

      - name: Check Python Files
        working-directory: attendance-service
        run: python -m compileall .

      - name: Verify Face Recognition
        run: python -c "import face_recognition; print('Face recognition installed successfully')"


  # --------------------------------------------------
  # 4. Backend Filesystem Security Scan
  # --------------------------------------------------
  security-scan-backend:
    name: Backend Filesystem Security Scan
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Backend Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
  # --------------------------------------------------
  # 5. Frontend Filesystem Security Scan
  # --------------------------------------------------
  security-scan-frontend:
    name: Frontend Filesystem Security Scan
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Frontend Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln,secret
          format: sarif
          output: trivy-frontend-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Frontend Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-results
          path: trivy-frontend-results.sarif
          if-no-files-found: ignore


  # --------------------------------------------------
  # 6. Attendance Filesystem Security Scan
  # --------------------------------------------------
  security-scan-attendance:
    name: Attendance Filesystem Security Scan
    runs-on: ubuntu-latest
    needs: test-attendance

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Attendance Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: attendance-service
          scanners: vuln,secret
          format: sarif
          output: trivy-attendance-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Attendance Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-attendance-results
          path: trivy-attendance-results.sarif
          if-no-files-found: ignore


  # --------------------------------------------------
  # 7. Build and Push Backend and Frontend Images
  # --------------------------------------------------
  build-push-kts:
    name: Build and Push Backend and Frontend Images
    runs-on: ubuntu-latest

    needs:
      - test-backend
      - build-frontend
      - security-scan-backend
      - security-scan-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_BACKEND }}:latest
            ${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_FRONTEND }}:latest
            ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}


  # --------------------------------------------------
  # 8. Build and Push Attendance Image
  # --------------------------------------------------
  build-push-attendance:
    name: Build and Push Attendance Image
    runs-on: ubuntu-latest
    needs:
      - test-attendance
      - security-scan-attendance

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Attendance Image
        uses: docker/build-push-action@v6
        with:
          context: ./attendance-service
          file: ./attendance-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_ATTENDANCE }}:latest
            ${{ env.DOCKER_IMAGE_ATTENDANCE }}:${{ github.sha }}


  # --------------------------------------------------
  # 9. Backend and Frontend Image Security Scan
  # --------------------------------------------------
  image-security-scan-kts:
    name: Backend and Frontend Image Security Scan
    runs-on: ubuntu-latest

    needs:
      - build-push-kts

    steps:
      - name: Run Trivy Backend Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Run Trivy Frontend Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"


  # --------------------------------------------------
  # 10. Attendance Image Security Scan
  # --------------------------------------------------
  image-security-scan-attendance:
    name: Attendance Image Security Scan
    runs-on: ubuntu-latest
    needs:
      - build-push-attendance

    steps:
      - name: Run Trivy Attendance Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_ATTENDANCE }}:${{ github.sha }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"


  # --------------------------------------------------
  # 11. KTS Application Deployment
  # --------------------------------------------------
  deploy-kts:
    name: KTS Application Deployment
    runs-on: ubuntu-latest

    needs:
      - image-security-scan-kts

    steps:
      - name: Deployment Status
        run: |
          echo "Backend and Frontend Docker images built successfully."
          echo "Docker images are available in Docker Hub."
          echo "Actual application deployment is not configured in this workflow."


  # --------------------------------------------------
  # 12. Attendance Service Deployment
  # --------------------------------------------------
  deploy-attendance:
    name: Attendance Service Deployment
    runs-on: ubuntu-latest

    needs:
      - image-security-scan-attendance

    steps:
      - name: Deployment Status
        run: |
          echo "Attendance Docker image built successfully."
          echo "Attendance image is available in Docker Hub."
          echo "Actual attendance deployment is not configured in this workflow."