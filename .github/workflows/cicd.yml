
name: KTS-People360 Combined CI/CD Pipeline

on:
  push:
    branches:
      - gayathri_devops
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"

  DOCKER_IMAGE_BACKEND: kts-people360-backend
  DOCKER_IMAGE_FRONTEND: kts-people360-frontend
  DOCKER_IMAGE_ATTENDANCE: attendance-service

jobs:

  # 1. Backend Test and Lint
  test-backend:
    name: Backend Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Lint
        working-directory: ./backend
        run: npm run lint

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test


  # 2. Frontend Build and Lint
  build-frontend:
    name: Frontend Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build


  # 3. Attendance Service Test
  test-attendance:
    name: Attendance Service Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: attendance-service/requirements.txt

      - name: Install Attendance Dependencies
        working-directory: ./attendance-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python Files
        working-directory: ./attendance-service
        run: python -m compileall -q .

      - name: Check Python Version
        run: python --version


  # 4. Backend Security Scan
  security-scan-backend:
    name: Backend Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Backend Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: ./backend
          format: sarif
          output: trivy-backend-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Backend Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-scan
          path: trivy-backend-results.sarif
          if-no-files-found: ignore


  # 5. Frontend Security Scan
  security-scan-frontend:
    name: Frontend Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Frontend Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: ./frontend
          format: sarif
          output: trivy-frontend-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Frontend Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-security-scan
          path: trivy-frontend-results.sarif
          if-no-files-found: ignore


  # 6. Attendance Security Scan
  security-scan-attendance:
    name: Attendance Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Attendance Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: ./attendance-service
          format: sarif
          output: trivy-attendance-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Attendance Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attendance-security-scan
          path: trivy-attendance-results.sarif
          if-no-files-found: ignore


  # 7. Build and Push Backend and Frontend Images
  build-push-kts:
    name: Build and Push Backend and Frontend Images
    runs-on: ubuntu-latest

    needs:
      - test-backend
      - build-frontend
      - security-scan-backend
      - security-scan-frontend

    if: github.ref == 'refs/heads/gayathri_devops'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_BACKEND }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=http://localhost:3001/api
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


  # 8. Build and Push Attendance Image
  build-push-attendance:
    name: Build and Push Attendance Image
    runs-on: ubuntu-latest

    needs:
      - test-attendance
      - security-scan-attendance

    if: github.ref == 'refs/heads/gayathri_devops'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Attendance Image
        uses: docker/build-push-action@v6
        with:
          context: ./attendance-service
          file: ./attendance-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_ATTENDANCE }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_ATTENDANCE }}:${{ github.sha }}
          cache-from: type=gha,scope=attendance
          cache-to: type=gha,mode=max,scope=attendance


  # 9. KTS Backend and Frontend Docker Image Security Scan
  image-security-scan-kts:
    name: KTS Docker Image Security Scan
    runs-on: ubuntu-latest

    needs: build-push-kts

    steps:
      - name: Run Backend Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          format: sarif
          output: trivy-backend-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Run Frontend Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          format: sarif
          output: trivy-frontend-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload KTS Image Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kts-image-security-scans
          path: |
            trivy-backend-image-results.sarif
            trivy-frontend-image-results.sarif
          if-no-files-found: ignore


  # 10. Attendance Docker Image Security Scan
  image-security-scan-attendance:
    name: Attendance Docker Image Security Scan
    runs-on: ubuntu-latest

    needs: build-push-attendance

    steps:
      - name: Run Attendance Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_ATTENDANCE }}:${{ github.sha }}
          format: sarif
          output: trivy-attendance-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Attendance Image Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attendance-image-security-scan
          path: trivy-attendance-image-results.sarif
          if-no-files-found: ignore


  # 11. KTS Deployment Information
  deploy-kts:
    name: KTS Deployment Information
    runs-on: ubuntu-latest

    needs: image-security-scan-kts

    if: github.ref == 'refs/heads/gayathri_devops'

    steps:
      - name: Display KTS Image Information
        run: |
          echo "KTS-People360 Backend and Frontend images built successfully."
          echo "Backend Image: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}"
          echo "Frontend Image: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}"
          echo "Actual AWS deployment is not configured in this workflow."


  # 12. Attendance Deployment Information
  deploy-attendance:
    name: Attendance Deployment Information
    runs-on: ubuntu-latest

    needs: image-security-scan-attendance

    if: github.ref == 'refs/heads/gayathri_devops'

    steps:
      - name: Display Attendance Image Information
        run: |
          echo "Attendance service image built successfully."
          echo "Attendance Image: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_ATTENDANCE }}:${{ github.sha }}"
          echo "Actual AWS deployment is not configured in this workflow."
